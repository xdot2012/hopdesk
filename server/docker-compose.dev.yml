services:
  postgres:
    image: postgis/postgis:14-3.3-alpine
    container_name: ${SYSTEM_NAME}-dev-database
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - database

  redis:
    image: redis:latest
    container_name: ${SYSTEM_NAME}-dev-cache
    ports:
      - "6380:6379"
    expose:
      - 6379
    networks:
      - database

  redis-insight:
    image: redis/redisinsight
    container_name: ${SYSTEM_NAME}-dev-cache-insight
    ports:
      - "5540:5540"
    expose:
      - 6379
    networks:
      - database

volumes:
  database:
    name: ${SYSTEM_NAME}-dev-data

networks:
  web:
  database:
